[project]
name = "exfoliator"
version = "0.1.0"
description = "Entropy oracle web app with header-transported compressed payload (server + client)"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "gunicorn>=23.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
